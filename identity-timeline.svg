<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Diachronic Identity Timeline">
  <defs>
    <linearGradient id="timelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="40" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">Identity Evolution: Learning ML Engineer</text>

  <!-- Timeline axis -->
  <line x1="100" y1="300" x2="1100" y2="300" stroke="url(#timelineGrad)" stroke-width="4"/>

  <!-- Time points and states -->
  <!-- T0: Starting -->
  <g>
    <circle cx="150" cy="300" r="12" fill="#3b82f6"/>
    <text x="150" y="340" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93c5fd" text-anchor="middle">Month 1</text>
    <text x="150" y="365" font-family="Inter, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Goal: Learn ML</text>
    <text x="150" y="380" font-family="Inter, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Confidence: Low</text>
    <text x="150" y="395" font-family="Inter, sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">Stability: Baseline</text>
  </g>

  <!-- T1: Refinement -->
  <g>
    <circle cx="350" cy="300" r="12" fill="#8b5cf6"/>
    <text x="350" y="340" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#d8b4fe" text-anchor="middle">Month 3</text>
    <text x="350" y="365" font-family="Inter, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">Focus: Computer Vision</text>
    <text x="350" y="380" font-family="Inter, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">Confidence: Medium</text>
    <text x="350" y="395" font-family="Inter, sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Trajectory: Narrowing</text>
  </g>

  <!-- T2: Rejection & Learning -->
  <g>
    <circle cx="550" cy="300" r="12" fill="#f97316"/>
    <text x="550" y="340" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fed7aa" text-anchor="middle">Month 5</text>
    <text x="550" y="365" font-family="Inter, sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">"Don't like deep learning"</text>
    <text x="550" y="380" font-family="Inter, sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">Prefer: Applications</text>
    <text x="550" y="395" font-family="Internet, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Signal: Rejection teaches us</text>
  </g>

  <!-- T3: Application Focus -->
  <g>
    <circle cx="750" cy="300" r="12" fill="#10b981"/>
    <text x="750" y="340" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#86efac" text-anchor="middle">Month 7</text>
    <text x="750" y="365" font-family="Inter, sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Goal: CV Applications</text>
    <text x="750" y="380" font-family="Inter, sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Confidence: High</text>
    <text x="750" y="395" font-family="Internet, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Stability: Strong</text>
  </g>

  <!-- T4: Production -->
  <g>
    <circle cx="950" cy="300" r="12" fill="#ec4899"/>
    <text x="950" y="340" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f472b6" text-anchor="middle">Month 12</text>
    <text x="950" y="365" font-family="Inter, sans-serif" font-size="12" fill="#fbcfe8" text-anchor="middle">Role: CV Engineer</text>
    <text x="950" y="380" font-family="Inter, sans-serif" font-size="12" fill="#fbcfe8" text-anchor="middle">Focus: Edge Deployment</text>
    <text x="950" y="395" font-family="Internet, sans-serif" font-size="10" fill="#f9a8d4" text-anchor="middle">Next: Mobile TensorFlow</text>
  </g>

  <!-- Trajectory arrow above -->
  <path d="M 160 250 Q 450 150 950 220" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.6"/>
  <text x="600" y="140" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">Identity Trajectory: Learning → Focus → Rejection → Application → Production</text>

  <!-- Key insight box -->
  <rect x="100" y="480" width="1000" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="510" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Key Insight: Diachronic identity tracks WHO they are becoming, not just WHO they are</text>
  <text x="600" y="535" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">The rejection phase teaches us they prefer practical work. The trajectory shows progression.</text>
  <text x="600" y="555" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">At month 12, a naive system would suggest "basic ML content." A diachronic system knows they need "edge deployment strategies."</text>
</svg>