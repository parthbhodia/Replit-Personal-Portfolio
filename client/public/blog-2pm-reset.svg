<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Beat the 2PM Slump">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fb923c"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(960 220)">
    <circle cx="0" cy="0" r="100" fill="url(#sun)" opacity="0.95"/>
    <g stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <line x1="-150" y1="0" x2="-115" y2="0"/>
      <line x1="115" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="-150" x2="0" y2="-115"/>
      <line x1="0" y1="115" x2="0" y2="150"/>
      <line x1="-106" y1="-106" x2="-82" y2="-82"/>
      <line x1="82" y1="-82" x2="106" y2="-106"/>
      <line x1="-106" y1="106" x2="-82" y2="82"/>
      <line x1="82" y1="82" x2="106" y2="106"/>
    </g>
    <text x="0" y="8" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#7c2d12">2:00 PM</text>
  </g>
  <text x="80" y="138" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#fbbf24">PRODUCTIVITY · ENERGY</text>
  <text x="80" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Beat the</text>
  <text x="80" y="350" font-family="Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">2 PM Slump</text>
  <text x="80" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#fde68a">Without drinking more coffee.</text>
  <line x1="80" y1="540" x2="220" y2="540" stroke="url(#accent)" stroke-width="4"/>
  <text x="80" y="580" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#fcd34d">Parth Bhodia · parthbhodia.com</text>
</svg>
