<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="Identity Failure Modes">
  <defs>
    <linearGradient id="failGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="failGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="failGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a21caf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="failGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#0f172a"/>

  <!-- Title -->
  <text x="700" y="40" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">Identity Failure Modes: Detection & Recovery</text>

  <!-- Failure 1: Forgetting -->
  <g>
    <rect x="50" y="80" width="310" height="320" rx="8" fill="url(#failGrad1)" opacity="0.15" stroke="#dc2626" stroke-width="2"/>

    <text x="205" y="115" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#fca5a5" text-anchor="middle">Forgetting</text>

    <text x="70" y="145" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fecaca">Signature:</text>
    <text x="70" y="162" font-family="Inter, sans-serif" font-size="10" fill="#fee2e2">"Why did you forget?</text>
    <text x="70" y="177" font-family="Inter, sans-serif" font-size="10" fill="#fee2e2">I told you this last month."</text>

    <text x="70" y="205" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fecaca">Example:</text>
    <text x="70" y="222" font-family="Inter, sans-serif" font-size="10" fill="#fee2e2">Math tutor forgets student</text>
    <text x="70" y="237" font-family="Inter, sans-serif" font-size="10" fill="#fee2e2">struggled with fractions.</text>

    <text x="70" y="265" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fecaca">Root Cause:</text>
    <text x="70" y="282" font-family="Inter, sans-serif" font-size="10" fill="#fee2e2">No stable identity layer</text>
    <text x="70" y="297" font-family="Inter, sans-serif" font-size="10" fill="#fee2e2">Context window limits</text>

    <text x="70" y="325" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#86efac">Fix:</text>
    <text x="70" y="342" font-family="Inter, sans-serif" font-size="9" fill="#bbf7d0">Durable layer: 5-10 facts</text>
    <text x="70" y="355" font-family="Inter, sans-serif" font-size="9" fill="#bbf7d0">Never age out</text>
  </g>

  <!-- Failure 2: Overfitting to Recency -->
  <g>
    <rect x="395" y="80" width="310" height="320" rx="8" fill="url(#failGrad2)" opacity="0.15" stroke="#f97316" stroke-width="2"/>

    <text x="550" y="115" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#fed7aa" text-anchor="middle">Overfitting to Recency</text>

    <text x="415" y="145" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fed7aa">Signature:</text>
    <text x="415" y="162" font-family="Inter, sans-serif" font-size="10" fill="#fef3c7">"You suddenly think</text>
    <text x="415" y="177" font-family="Inter, sans-serif" font-size="10" fill="#fef3c7">I like X (mentioned once)"</text>

    <text x="415" y="205" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fed7aa">Example:</text>
    <text x="415" y="222" font-family="Inter, sans-serif" font-size="10" fill="#fef3c7">User explores Rust (curious)</text>
    <text x="415" y="237" font-family="Inter, sans-serif" font-size="10" fill="#fef3c7">System: "New career!"</text>

    <text x="415" y="265" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fed7aa">Root Cause:</text>
    <text x="415" y="282" font-family="Inter, sans-serif" font-size="10" fill="#fef3c7">No stability weighting</text>
    <text x="415" y="297" font-family="Inter, sans-serif" font-size="10" fill="#fef3c7">One signal = all weight</text>

    <text x="415" y="325" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#86efac">Fix:</text>
    <text x="415" y="342" font-family="Inter, sans-serif" font-size="9" fill="#bbf7d0">Require repetition for</text>
    <text x="415" y="355" font-family="Inter, sans-serif" font-size="9" fill="#bbf7d0">weight growth</text>
  </g>

  <!-- Failure 3: Profile Lock-In -->
  <g>
    <rect x="740" y="80" width="310" height="320" rx="8" fill="url(#failGrad3)" opacity="0.15" stroke="#d946ef" stroke-width="2"/>

    <text x="895" y="115" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#f0abfc" text-anchor="middle">Profile Lock-In</text>

    <text x="760" y="145" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f0abfc">Signature:</text>
    <text x="760" y="162" font-family="Inter, sans-serif" font-size="10" fill="#fce7f3">"You treat me like</text>
    <text x="760" y="177" font-family="Inter, sans-serif" font-size="10" fill="#fce7f3">a beginner still"</text>

    <text x="760" y="205" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f0abfc">Example:</text>
    <text x="760" y="222" font-family="Inter, sans-serif" font-size="10" fill="#fce7f3">Math tutor: started weak,</text>
    <text x="760" y="237" font-family="Inter, sans-serif" font-size="10" fill="#fce7f3">now strong. Still gets</text>
    <text x="760" y="252" font-family="Inter, sans-serif" font-size="10" fill="#fce7f3">beginner explanations</text>

    <text x="760" y="280" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f0abfc">Root Cause:</text>
    <text x="760" y="297" font-family="Internet, sans-serif" font-size="10" fill="#fce7f3">No trajectory layer</text>
    <text x="760" y="312" font-family="Internet, sans-serif" font-size="10" fill="#fce7f3">Initial state frozen</text>

    <text x="760" y="340" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#86efac">Fix:</text>
    <text x="760" y="357" font-family="Internet, sans-serif" font-size="9" fill="#bbf7d0">Track progression &</text>
    <text x="760" y="370" font-family="Internet, sans-serif" font-size="9" fill="#bbf7d0">update difficulty level</text>
  </g>

  <!-- Failure 4: Context Bloat -->
  <g>
    <rect x="1085" y="80" width="310" height="320" rx="8" fill="url(#failGrad4)" opacity="0.15" stroke="#06b6d4" stroke-width="2"/>

    <text x="1240" y="115" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#a5f3fc" text-anchor="middle">Context Bloat</text>

    <text x="1105" y="145" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#a5f3fc">Signature:</text>
    <text x="1105" y="162" font-family="Inter, sans-serif" font-size="10" fill="#cffafe">"You're giving me</text>
    <text x="1105" y="177" font-family="Inter, sans-serif" font-size="10" fill="#cffafe">random facts"</text>

    <text x="1105" y="205" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#a5f3fc">Example:</text>
    <text x="1105" y="222" font-family="Inter, sans-serif" font-size="10" fill="#cffafe">1000 interactions</text>
    <text x="1105" y="237" font-family="Inter, sans-serif" font-size="10" fill="#cffafe">stored. Synthesis</text>
    <text x="1105" y="252" font-family="Inter, sans-serif" font-size="10" fill="#cffafe">drowns in noise</text>

    <text x="1105" y="280" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#a5f3fc">Root Cause:</text>
    <text x="1105" y="297" font-family="Internet, sans-serif" font-size="10" fill="#cffafe">No compression</text>
    <text x="1105" y="312" font-family="Internet, sans-serif" font-size="10" fill="#cffafe">Everything stored raw</text>

    <text x="1105" y="340" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#86efac">Fix:</text>
    <text x="1105" y="357" font-family="Internet, sans-serif" font-size="9" fill="#bbf7d0">Summarize & compress</text>
    <text x="1105" y="370" font-family="Internet, sans-serif" font-size="9" fill="#bbf7d0">Extract signal</text>
  </g>

  <!-- Recovery framework at bottom -->
  <rect x="50" y="430" width="1345" height="330" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <text x="700" y="465" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">Recovery Framework: Detecting & Fixing Failures</text>

  <!-- Timeline showing detection and recovery -->
  <line x1="100" y1="520" x2="1350" y2="520" stroke="#64748b" stroke-width="2"/>

  <!-- Stage 1: Detection -->
  <g>
    <circle cx="200" cy="520" r="8" fill="#3b82f6"/>
    <text x="200" y="555" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">Week 2-3</text>
    <text x="200" y="575" font-family="Inter, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">User frustration</text>
    <text x="200" y="590" font-family="Inter, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">appears in</text>
    <text x="200" y="605" font-family="Inter, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">feedback</text>
  </g>

  <!-- Stage 2: Diagnosis -->
  <g>
    <circle cx="500" cy="520" r="8" fill="#8b5cf6"/>
    <text x="500" y="555" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe" text-anchor="middle">Analysis</text>
    <text x="500" y="575" font-family="Inter, sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle">Identify which</text>
    <text x="500" y="590" font-family="Inter, sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle">failure mode</text>
    <text x="500" y="605" font-family="Inter, sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle">is happening</text>
  </g>

  <!-- Stage 3: Root Cause -->
  <g>
    <circle cx="800" cy="520" r="8" fill="#f97316"/>
    <text x="800" y="555" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#fed7aa" text-anchor="middle">Root Cause</text>
    <text x="800" y="575" font-family="Inter, sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle">Architecture</text>
    <text x="800" y="590" font-family="Inter, sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle">issue or data</text>
    <text x="800" y="605" font-family="Inter, sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle">quality issue</text>
  </g>

  <!-- Stage 4: Implementation -->
  <g>
    <circle cx="1100" cy="520" r="8" fill="#10b981"/>
    <text x="1100" y="555" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#86efac" text-anchor="middle">Fix Applied</text>
    <text x="1100" y="575" font-family="Inter, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Add layer,</text>
    <text x="1100" y="590" font-family="Inter, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">adjust weighting,</text>
    <text x="1100" y="605" font-family="Internet, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">enable control</text>
  </g>

  <!-- Stage 5: Validation -->
  <g>
    <circle cx="1300" cy="520" r="8" fill="#ec4899"/>
    <text x="1300" y="555" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">Retest</text>
    <text x="1300" y="575" font-family="Internet, sans-serif" font-size="11" fill="#fbcfe8" text-anchor="middle">Verify recovery</text>
    <text x="1300" y="590" font-family="Internet, sans-serif" font-size="11" fill="#fbcfe8" text-anchor="middle">speed and</text>
    <text x="1300" y="605" font-family="Internet, sans-serif" font-size="11" fill="#fbcfe8" text-anchor="middle">quality</text>
  </g>

  <!-- Key metric -->
  <rect x="100" y="650" width="1250" height="70" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="700" y="680" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#06b6d4" text-anchor="middle">Key Metric: Recovery Speed</text>
  <text x="700" y="705" font-family="Internet, sans-serif" font-size="11" fill="#a5f3fc" text-anchor="middle">After user correction, how quickly does the error influence the system less? Good systems show 50% decay per week.</text>
</svg>